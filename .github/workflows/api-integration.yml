name: API Integration

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "project-manager-app/apps/api/**"
      - "project-manager-app/apps/worker/**"
      - "project-manager-app/scripts/api-integration.mjs"
      - "project-manager-app/scripts/api-f01-bids-integration.mjs"
      - "project-manager-app/scripts/api-authenticated-f01-f02-smoke.mjs"
      # La ruta de migracion: este job es lo unico que la ejercita contra un
      # Postgres real, asi que un cambio en ella tiene que dispararlo.
      - "project-manager-app/scripts/pre-migrate.mjs"
      - "project-manager-app/packages/db/**"
      - ".github/workflows/api-integration.yml"
  pull_request:
    paths:
      - "project-manager-app/apps/api/**"
      - "project-manager-app/apps/worker/**"
      - "project-manager-app/scripts/api-integration.mjs"
      - "project-manager-app/scripts/api-f01-bids-integration.mjs"
      - "project-manager-app/scripts/api-authenticated-f01-f02-smoke.mjs"
      # La ruta de migracion: este job es lo unico que la ejercita contra un
      # Postgres real, asi que un cambio en ella tiene que dispararlo.
      - "project-manager-app/scripts/pre-migrate.mjs"
      - "project-manager-app/packages/db/**"
      - ".github/workflows/api-integration.yml"

concurrency:
  group: api-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: project-manager-app

jobs:
  integration:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: semse
          POSTGRES_PASSWORD: semse
          POSTGRES_DB: semse
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U semse -d semse"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://semse:semse@127.0.0.1:5433/semse?schema=public
      # Isolated synthetic CI only: exercise the explicitly activated grant path.
      SEMSE_PROMETEO_DOCUMENT_SHARING_ENABLED: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: project-manager-app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # El build va ANTES de migrar, al reves que antes: pre-migrate.mjs
      # importa @prisma/client, que no existe hasta que build:api corre
      # prisma generate. En produccion no se nota porque la imagen genera el
      # cliente en el build y el CMD solo arranca; este orden reproduce eso.
      - name: Build workspace packages and API
        run: pnpm build:api

      # Se ejecuta el mismo script que corre el contenedor al arrancar
      # (Dockerfile.api CMD / startCommand de Railway), no `pnpm db:migrate`:
      # asi la ruta de migracion de produccion queda probada en CI contra un
      # Postgres real, incluido el `migrate deploy` que aplica el SQL.
      - name: Apply database migrations (production boot path)
        run: node scripts/pre-migrate.mjs

      # build:api ya se ejecutó antes de aplicar migraciones; usar las mismas
      # pruebas del paquete sin reconstruir el monorepo una segunda vez.
      - name: Run DB-backed API integration tests
        run: pnpm --filter @semse/api test:integration

      - name: Start API
        run: |
          pnpm start:api > /tmp/semse-api-integration.log 2>&1 &
          echo $! > /tmp/semse-api-integration.pid

      - name: Wait for healthcheck
        run: |
          for i in {1..60}; do
            if curl -sSf http://localhost:4000/v1/health >/dev/null; then
              echo "API is up"
              exit 0
            fi
            sleep 1
          done
          echo "API did not start in time"
          tail -n 200 /tmp/semse-api-integration.log || true
          exit 1

      - name: Run API integration script
        env:
          SEMSE_API_URL: http://localhost:4000
          SEMSE_ROLES: OPS_ADMIN,WORKER
          SEMSE_WORKER_ID: gh-worker-integration
        run: node ./scripts/api-integration.mjs

      - name: F01 synthetic Marketplace Bid to Accept HTTP/Postgres smoke
        env:
          SEMSE_API_URL: http://127.0.0.1:4000
          SEMSE_F01_ISOLATED_DB: "1"
        run: node ./scripts/api-f01-bids-integration.mjs

      # Separate signed-session test API on 127.0.0.1:4001. The earlier
      # API without AUTH_SECRET stays on port 4000 for existing smoke tests.
      # This is a throwaway GitHub runner and an ephemeral Postgres container.
      - name: Start authenticated API (isolated localhost)
        run: |
          AUTH_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$AUTH_SECRET"
          echo "SEMSE_AUTH_INTEGRATION_SECRET=$AUTH_SECRET" >> "$GITHUB_ENV"
          AUTH_SECRET="$AUTH_SECRET" PORT=4001 HOST=127.0.0.1 NODE_ENV=test pnpm start:api > /tmp/semse-api-auth-integration.log 2>&1 &
          echo $! > /tmp/semse-api-auth-integration.pid

      - name: Wait for authenticated API healthcheck
        run: |
          for i in {1..60}; do
            if curl -sSf http://127.0.0.1:4001/v1/health >/dev/null; then
              echo "Authenticated CI API is up"
              exit 0
            fi
            sleep 1
          done
          echo "Authenticated API did not start"
          tail -n 100 /tmp/semse-api-auth-integration.log || true
          exit 1

      # Same signed identity/temporary DB, but grants disabled in a second API
      # process. This is a real HTTP kill-switch test without touching Railway.
      - name: Start sharing-OFF signed API (isolated localhost)
        run: |
          SEMSE_PROMETEO_DOCUMENT_SHARING_ENABLED=false AUTH_SECRET="$SEMSE_AUTH_INTEGRATION_SECRET" PORT=4002 HOST=127.0.0.1 NODE_ENV=test pnpm start:api > /tmp/semse-api-sharing-off-integration.log 2>&1 &
          echo $! > /tmp/semse-api-sharing-off-integration.pid

      - name: Wait for sharing-OFF signed API
        run: |
          for i in {1..60}; do
            if curl -sSf http://127.0.0.1:4002/v1/health >/dev/null; then
              echo "Sharing-OFF API is up"
              exit 0
            fi
            sleep 1
          done
          echo "Sharing-OFF API did not start"
          tail -n 100 /tmp/semse-api-sharing-off-integration.log || true
          exit 1

      - name: F01 F02 signed-session HTTP Postgres acceptance tests
        env:
          SEMSE_API_URL: http://127.0.0.1:4001
          SEMSE_SHARE_OFF_API_URL: http://127.0.0.1:4002
          SEMSE_AUTH_TEST_ONLY: "1"
          NODE_ENV: test
        run: node ./scripts/api-authenticated-f01-f02-smoke.mjs

      - name: Stop sharing-OFF API
        if: always()
        run: |
          if [ -f /tmp/semse-api-sharing-off-integration.pid ]; then
            kill "$(cat /tmp/semse-api-sharing-off-integration.pid)" || true
          fi

      - name: Stop authenticated API
        if: always()
        run: |
          if [ -f /tmp/semse-api-auth-integration.pid ]; then
            kill "$(cat /tmp/semse-api-auth-integration.pid)" || true
          fi

      - name: Stop API
        if: always()
        run: |
          if [ -f /tmp/semse-api-integration.pid ]; then
            kill "$(cat /tmp/semse-api-integration.pid)" || true
          fi

      - name: Upload API integration log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-integration-log
          path: |
            /tmp/semse-api-integration.log
            /tmp/semse-api-auth-integration.log
            /tmp/semse-api-sharing-off-integration.log
          if-no-files-found: ignore

  # A rollback to pre-P0 main is UNSAFE: legacy Prometeo lists by tenant alone.
  # Exercise a pinned post-P0 security checkpoint binary on the HEAD's expanded
  # schema instead. This is isolated CI evidence, NOT production rollback.
  rollback-safe-checkpoint:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 987 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: semse
          POSTGRES_PASSWORD: semse
          POSTGRES_DB: semse
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U semse -d semse"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://semse:semse@127.0.0.1:5433/semse?schema=public
      SEMSE_EVENT_CONSUMERS_ENABLED: "false"
      SEMSE_EVENT_OUTBOX_DISPATCH_ENABLED: "false"
      SEMSE_CURATED_KNOWLEDGE_ENABLED: "false"
      PAYMENT_PROVIDER: mock
    steps:
      - name: Checkout candidate HEAD for current expanded-schema migration and smoke
        uses: actions/checkout@v7
        with:
          path: current

      - name: Checkout pinned post-P0 safe rollback binary source
        uses: actions/checkout@v7
        with:
          ref: 4ba16f4e598bea702c5629518e0701a31c68b7ae
          path: safe-rollback

      - name: Refuse any rollback target other than signed-off security checkpoint
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/safe-rollback"
          CANDIDATE="$(git rev-parse HEAD)"
          test "$CANDIDATE" = "4ba16f4e598bea702c5629518e0701a31c68b7ae"
          echo "P0 rollback drill: pinned post-P0 checkpoint only; pre-fix main is not an approved rollback target"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build candidate HEAD and migrate isolated expanded schema
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/current/project-manager-app"
          pnpm install --frozen-lockfile
          pnpm build:api
          node scripts/pre-migrate.mjs

      - name: Build pinned safe checkpoint without reverting database migrations
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/safe-rollback/project-manager-app"
          pnpm install --frozen-lockfile
          pnpm build:api

      - name: Start previous security-safe binary against expanded-schema database
        run: |
          set -euo pipefail
          AUTH_SECRET="$(openssl rand -hex 48)"
          echo "::add-mask::$AUTH_SECRET"
          echo "SEMSE_ROLLBACK_DRILL_AUTH_SECRET=$AUTH_SECRET" >> "$GITHUB_ENV"
          cd "$GITHUB_WORKSPACE/safe-rollback/project-manager-app"
          AUTH_SECRET="$AUTH_SECRET" HOST=127.0.0.1 PORT=4001 NODE_ENV=test SEMSE_PROMETEO_DOCUMENT_SHARING_ENABLED=true pnpm start:api > "$RUNNER_TEMP/safe-rollback-api-on.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/safe-rollback-api-on.pid"
          AUTH_SECRET="$AUTH_SECRET" HOST=127.0.0.1 PORT=4002 NODE_ENV=test SEMSE_PROMETEO_DOCUMENT_SHARING_ENABLED=false pnpm start:api > "$RUNNER_TEMP/safe-rollback-api-off.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/safe-rollback-api-off.pid"

      - name: Wait for both signed rollback APIs
        run: |
          set -euo pipefail
          for port in 4001 4002; do
            ready=0
            for attempt in $(seq 1 90); do
              if curl -fsS -o /dev/null "http://127.0.0.1:$port/v1/health"; then ready=1; break; fi
              sleep 2
            done
            if [ "$ready" -ne 1 ]; then
              echo "Rollback checkpoint API $port did not become ready"
              exit 1
            fi
          done

      - name: Verify real signed-session private scopes survive binary rollback
        env:
          CI: "true"
          SEMSE_AUTH_TEST_ONLY: "1"
          NODE_ENV: test
          SEMSE_API_URL: http://127.0.0.1:4001
          SEMSE_SHARE_OFF_API_URL: http://127.0.0.1:4002
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/current/project-manager-app"
          node scripts/api-authenticated-f01-f02-smoke.mjs

      - name: Stop isolated rollback APIs
        if: always()
        run: |
          for name in on off; do
            path="$RUNNER_TEMP/safe-rollback-api-$name.pid"
            if [ -f "$path" ]; then kill "$(cat "$path")" || true; fi
          done

      - name: Report test scope
        if: success()
        run: |
          echo "PASS: post-P0 safe checkpoint boots with expanded HEAD schema and signed scope smoke"
          echo "NOT PROVEN: rollback to pre-P0 main, real staging, traffic capture or production cutover"
