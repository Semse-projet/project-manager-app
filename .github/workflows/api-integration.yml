name: API Integration

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "project-manager-app/apps/api/**"
      - "project-manager-app/apps/worker/**"
      - "project-manager-app/scripts/api-integration.mjs"
      - "project-manager-app/scripts/api-f01-bids-integration.mjs"
      - "project-manager-app/scripts/api-authenticated-f01-f02-smoke.mjs"
      # La ruta de migracion: este job es lo unico que la ejercita contra un
      # Postgres real, asi que un cambio en ella tiene que dispararlo.
      - "project-manager-app/scripts/pre-migrate.mjs"
      - "project-manager-app/packages/db/**"
      - ".github/workflows/api-integration.yml"
  pull_request:
    paths:
      - "project-manager-app/apps/api/**"
      - "project-manager-app/apps/worker/**"
      - "project-manager-app/scripts/api-integration.mjs"
      - "project-manager-app/scripts/api-f01-bids-integration.mjs"
      - "project-manager-app/scripts/api-authenticated-f01-f02-smoke.mjs"
      # La ruta de migracion: este job es lo unico que la ejercita contra un
      # Postgres real, asi que un cambio en ella tiene que dispararlo.
      - "project-manager-app/scripts/pre-migrate.mjs"
      - "project-manager-app/packages/db/**"
      - ".github/workflows/api-integration.yml"

concurrency:
  group: api-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: project-manager-app

jobs:
  integration:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: semse
          POSTGRES_PASSWORD: semse
          POSTGRES_DB: semse
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U semse -d semse"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://semse:semse@127.0.0.1:5433/semse?schema=public
      # Isolated synthetic CI only: exercise the explicitly activated grant path.
      SEMSE_PROMETEO_DOCUMENT_SHARING_ENABLED: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: project-manager-app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # El build va ANTES de migrar, al reves que antes: pre-migrate.mjs
      # importa @prisma/client, que no existe hasta que build:api corre
      # prisma generate. En produccion no se nota porque la imagen genera el
      # cliente en el build y el CMD solo arranca; este orden reproduce eso.
      - name: Build workspace packages and API
        run: pnpm build:api

      # Se ejecuta el mismo script que corre el contenedor al arrancar
      # (Dockerfile.api CMD / startCommand de Railway), no `pnpm db:migrate`:
      # asi la ruta de migracion de produccion queda probada en CI contra un
      # Postgres real, incluido el `migrate deploy` que aplica el SQL.
      - name: Apply database migrations (production boot path)
        run: node scripts/pre-migrate.mjs

      # build:api ya se ejecutó antes de aplicar migraciones; usar las mismas
      # pruebas del paquete sin reconstruir el monorepo una segunda vez.
      - name: Run DB-backed API integration tests
        run: pnpm --filter @semse/api test:integration

      - name: Start API
        run: |
          pnpm start:api > /tmp/semse-api-integration.log 2>&1 &
          echo $! > /tmp/semse-api-integration.pid

      - name: Wait for healthcheck
        run: |
          for i in {1..60}; do
            if curl -sSf http://localhost:4000/v1/health >/dev/null; then
              echo "API is up"
              exit 0
            fi
            sleep 1
          done
          echo "API did not start in time"
          tail -n 200 /tmp/semse-api-integration.log || true
          exit 1

      - name: Run API integration script
        env:
          SEMSE_API_URL: http://localhost:4000
          SEMSE_ROLES: OPS_ADMIN,WORKER
          SEMSE_WORKER_ID: gh-worker-integration
        run: node ./scripts/api-integration.mjs

      - name: F01 synthetic Marketplace Bid to Accept HTTP/Postgres smoke
        env:
          SEMSE_API_URL: http://127.0.0.1:4000
          SEMSE_F01_ISOLATED_DB: "1"
        run: node ./scripts/api-f01-bids-integration.mjs

      # Separate signed-session test API on 127.0.0.1:4001. The earlier
      # API without AUTH_SECRET stays on port 4000 for existing smoke tests.
      # This is a throwaway GitHub runner and an ephemeral Postgres container.
      - name: Start authenticated API (isolated localhost)
        run: |
          AUTH_SECRET="$(openssl rand -hex 32)" PORT=4001 HOST=127.0.0.1 NODE_ENV=test pnpm start:api > /tmp/semse-api-auth-integration.log 2>&1 &
          echo $! > /tmp/semse-api-auth-integration.pid

      - name: Wait for authenticated API healthcheck
        run: |
          for i in {1..60}; do
            if curl -sSf http://127.0.0.1:4001/v1/health >/dev/null; then
              echo "Authenticated CI API is up"
              exit 0
            fi
            sleep 1
          done
          echo "Authenticated API did not start"
          tail -n 100 /tmp/semse-api-auth-integration.log || true
          exit 1

      - name: F01 F02 signed-session HTTP Postgres acceptance tests
        env:
          SEMSE_API_URL: http://127.0.0.1:4001
          SEMSE_AUTH_TEST_ONLY: "1"
          NODE_ENV: test
        run: node ./scripts/api-authenticated-f01-f02-smoke.mjs

      - name: Stop authenticated API
        if: always()
        run: |
          if [ -f /tmp/semse-api-auth-integration.pid ]; then
            kill "$(cat /tmp/semse-api-auth-integration.pid)" || true
          fi

      - name: Stop API
        if: always()
        run: |
          if [ -f /tmp/semse-api-integration.pid ]; then
            kill "$(cat /tmp/semse-api-integration.pid)" || true
          fi

      - name: Upload API integration log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-integration-log
          path: |
            /tmp/semse-api-integration.log
            /tmp/semse-api-auth-integration.log
          if-no-files-found: ignore
