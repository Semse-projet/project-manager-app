name: Ubuntu 26 Compatibility Canary

on:
  workflow_dispatch:
  schedule:
    # Weekly, off the top of the hour to reduce shared-runner contention.
    - cron: "17 13 * * 1"
  pull_request:
    paths:
      - ".github/workflows/ubuntu-26-compat-canary.yml"

permissions:
  contents: read

concurrency:
  group: ubuntu-26-compat-canary-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: project-manager-app

jobs:
  compatibility:
    name: ubuntu-26-compatibility
    runs-on: ubuntu-26.04
    timeout-minutes: 25

    steps:
      - name: Runner diagnostics
        working-directory: .
        run: |
          set -euo pipefail
          cat /etc/os-release
          uname -a
          df -h .
          df -h /tmp || true
          mount | grep ' /tmp ' || true

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: project-manager-app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify toolchain
        run: pnpm check:toolchain

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build API runtime
        run: pnpm build:api

      - name: Verify Playwright system dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Record final disk state
        if: always()
        working-directory: .
        run: |
          df -h .
          df -h /tmp || true
