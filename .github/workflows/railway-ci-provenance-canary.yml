name: Railway CI provenance guard tests
on:
  push:
    branches: [security/railway-ci-provenance-p0]
    paths:
      - .github/workflows/railway-deploy.yml
      - .github/workflows/railway-ci-provenance-canary.yml
      - scripts/security/test_railway_ci_provenance.py
permissions:
  contents: read
jobs:
  guard-tests:
    if: github.repository == 'Semse-projet/project-manager-app' && github.ref == 'refs/heads/security/railway-ci-provenance-p0'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test inline deployment gate without network or Railway secrets
        run: python3 -m unittest discover -s scripts/security -p test_railway_ci_provenance.py -v
