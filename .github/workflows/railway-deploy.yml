name: Railway Deploy

# serviceInstanceDeploy(latestCommit: true, commitSha: SHA) triggers a REAL
# fresh build from source — unlike serviceInstanceDeployV2 which redeploys
# the same cached image. Always use this form when pushing code changes.
#
# Gate P0 2026-07-13: este workflow ya NO se dispara con cada push a main.
# Solo despliega cuando el workflow CI del MISMO SHA terminó en success
# (workflow_run), y despliega exactamente ese SHA (DEPLOY_SHA =
# workflow_run.head_sha). Si CI falla, no hay deploy — producción se queda en
# el último SHA sano.
#
# Rollback: re-ejecutar este workflow con workflow_dispatch desde main NO
# retrocede código; para volver a un SHA anterior, revertir el commit en main
# (git revert) y dejar que CI + este gate desplieguen el revert. Nunca
# desplegar a mano un SHA sin CI verde.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: railway-deploy
  cancel-in-progress: false

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-24.04
    # Token restringido para comprobación de CI y SHA.
    permissions:
      actions: read
      contents: read
    # CI automático debe provenir de push a main en este mismo repositorio.
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main')
    outputs:
      deploy_sha: ${{ steps.resolve-sha.outputs.deploy_sha }}
    steps:
      - name: Resolve verified SHA
        id: resolve-sha
        env:
          # En workflow_run, GITHUB_SHA apunta al último commit de la rama por
          # defecto en el momento del evento — puede NO ser el SHA que CI
          # validó. head_sha sí es el commit exacto evaluado por CI.
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            deploy_sha="$WORKFLOW_RUN_HEAD_SHA"
          else
            deploy_sha="$GITHUB_SHA"
          fi
          [ -n "$deploy_sha" ] || { echo "No se pudo resolver el SHA a desplegar"; exit 1; }
          echo "deploy_sha=$deploy_sha" >> "$GITHUB_OUTPUT"
          echo "SHA verificado a desplegar: $deploy_sha"

      # P0: CI autorizado del SHA actual antes de usar cualquier secreto Railway.
      - name: Verify exact-main CI provenance (fail closed)
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ steps.resolve-sha.outputs.deploy_sha }}
          DEPLOY_EVENT: ${{ github.event_name }}
          TRIGGER_CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          python3 - <<'PY'
          """Fail-closed CI provenance gate for SEMSE Railway production."""
          from __future__ import annotations
          import json
          import os
          import sys
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          REQUIRED = frozenset(("quality-gates", "unit-coverage", "e2e"))

          def fail(reason):
              raise RuntimeError("DENY Railway deployment: " + reason)

          def gh_api(repo, token):
              def get(path):
                  request = Request(
                      "https://api.github.com/repos/" + repo + "/" + path,
                      headers={
                          "Accept": "application/vnd.github+json",
                          "Authorization": "Bearer " + token,
                          "X-GitHub-Api-Version": "2022-11-28",
                          "User-Agent": "SEMSE-Railway-CI-Gate",
                      },
                  )
                  with urlopen(request, timeout=20) as response:
                      return json.load(response)
              return get

          def verify(env, get):
              repo = env.get("GITHUB_REPOSITORY", "")
              sha = env.get("DEPLOY_SHA", "")
              event = env.get("DEPLOY_EVENT", "")
              if not repo or not sha or len(sha) != 40 or not all(x in "0123456789abcdef" for x in sha):
                  fail("invalid repository or SHA")
              if event not in ("workflow_run", "workflow_dispatch"):
                  fail("unsupported event")
              if get("branches/main").get("commit", {}).get("sha") != sha:
                  fail("SHA differs from the current main HEAD")
              if event == "workflow_run":
                  trigger_id = env.get("TRIGGER_CI_RUN_ID", "")
                  if not trigger_id.isdecimal() or int(trigger_id) == 0:
                      fail("invalid triggering workflow ID")
                  run = get("actions/runs/" + trigger_id)
              else:
                  query = urlencode({"head_sha": sha, "branch": "main", "event": "push", "per_page": 100})
                  response = get("actions/workflows/ci.yml/runs?" + query)
                  candidates = response.get("workflow_runs", [])
                  if response.get("total_count", len(candidates)) > len(candidates):
                      fail("incomplete CI run history")
                  if not candidates:
                      fail("no CI push run for main SHA")
                  run = max(candidates, key=lambda r: (r.get("run_number", 0), r.get("run_attempt", 0)))
              if run.get("event") != "push" or run.get("head_branch") != "main":
                  fail("CI did not originate from push to main")
              if run.get("head_sha") != sha:
                  fail("CI SHA mismatch")
              if run.get("repository", {}).get("full_name") != repo:
                  fail("CI repository mismatch")
              if run.get("head_repository", {}).get("full_name") != repo:
                  fail("CI head repository mismatch")
              workflow_path = str(run.get("path", "")).split("@", 1)[0]
              if workflow_path != ".github/workflows/ci.yml":
                  fail("incorrect CI workflow")
              if run.get("status") != "completed" or run.get("conclusion") != "success":
                  fail("CI is not successfully completed")
              run_id = run.get("id")
              if not isinstance(run_id, int) or run_id <= 0:
                  fail("invalid CI run identifier")
              result = get("actions/runs/" + str(run_id) + "/jobs?per_page=100")
              jobs = result.get("jobs", [])
              if result.get("total_count", len(jobs)) > len(jobs):
                  fail("incomplete CI job list")
              for name in REQUIRED:
                  matches = [j for j in jobs if j.get("name") == name]
                  if len(matches) != 1 or matches[0].get("status") != "completed" or matches[0].get("conclusion") != "success":
                      fail("required CI job missing, skipped or unsuccessful: " + name)
              print("Approved CI provenance:", sha, "run", run_id)
              return run_id

          if __name__ == "__main__":
              try:
                  verify(os.environ, gh_api(os.environ["GITHUB_REPOSITORY"], os.environ["GH_TOKEN"]))
              except Exception as exc:
                  print("::error title=Railway CI provenance::" + str(exc), file=sys.stderr)
                  sys.exit(1)
          PY

      - name: Deploy exact commit to Railway (fresh build)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          ENV_ID: d682210a-956a-4508-9c5b-4ca5959278f9
          DEPLOY_SHA: ${{ steps.resolve-sha.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          # semse-worker, semse-API, semse-web, semse-vision (proyecto SEMSEproject)
          for svc in \
            26cd1c52-1a07-4f05-8b21-9a225e601d7a \
            2bd1bd3f-9aa1-4fc3-a714-4cf90c52c770 \
            40ab1cd0-b0a6-4760-a43f-8742c1962ef7 \
            63a901e8-189e-4748-97f7-b7e60e628ee2; do
            response=$(curl -sf -X POST https://backboard.railway.com/graphql/v2 \
              -H "Authorization: Bearer $RAILWAY_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"query\":\"mutation { serviceInstanceDeploy(serviceId: \\\"$svc\\\", environmentId: \\\"$ENV_ID\\\", latestCommit: true, commitSha: \\\"$DEPLOY_SHA\\\") }\"}")
            # Un error GraphQL también contiene "serviceInstanceDeploy" en su
            # "path" — hay que exigir data:true y rechazar cualquier "errors".
            echo "$response" | grep -q '"serviceInstanceDeploy":true' \
              || { echo "Deploy failed for service $svc: $response"; exit 1; }
            if echo "$response" | grep -q '"errors"'; then
              echo "Deploy returned GraphQL errors for $svc: $response"; exit 1
            fi
            echo "Fresh build de $DEPLOY_SHA disparado para servicio $svc"
          done

  health-check:
    needs: deploy
    runs-on: ubuntu-24.04
    # Solo lectura del repo, y solo para traer el verificador de procedencia (C02).
    permissions:
      contents: read
    steps:
      # La URL pública responde con el deployment ANTERIOR mientras el nuevo
      # compila — verificar que el deployment del commit exacto existe y llega
      # a SUCCESS es el gate real; el curl de abajo solo confirma que sirve.
      - name: Verify fresh deployments reached SUCCESS
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          ENV_ID: d682210a-956a-4508-9c5b-4ca5959278f9
          DEPLOY_SHA: ${{ needs.deploy.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          for svc in \
            26cd1c52-1a07-4f05-8b21-9a225e601d7a \
            2bd1bd3f-9aa1-4fc3-a714-4cf90c52c770 \
            40ab1cd0-b0a6-4760-a43f-8742c1962ef7 \
            63a901e8-189e-4748-97f7-b7e60e628ee2; do
            ok=""
            for attempt in $(seq 1 40); do
              response=$(curl -sf -X POST https://backboard.railway.com/graphql/v2 \
                -H "Authorization: Bearer $RAILWAY_TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"query\":\"{ deployments(first: 1, input: { serviceId: \\\"$svc\\\", environmentId: \\\"$ENV_ID\\\" }) { edges { node { status meta } } } }\"}") || { sleep 15; continue; }
              status=$(echo "$response" | grep -o '"status":"[A-Z_]*"' | head -1 | cut -d'"' -f4)
              commit=$(echo "$response" | grep -o '"commitHash":"[a-f0-9]*"' | head -1 | cut -d'"' -f4)
              if [ "$commit" = "$DEPLOY_SHA" ] && [ "$status" = "SUCCESS" ]; then
                echo "servicio $svc: deployment de $DEPLOY_SHA en SUCCESS ✅"; ok=1; break
              fi
              if [ "$commit" = "$DEPLOY_SHA" ] && { [ "$status" = "FAILED" ] || [ "$status" = "CRASHED" ]; }; then
                echo "servicio $svc: deployment de $DEPLOY_SHA terminó en $status ❌"; exit 1
              fi
              echo "servicio $svc: esperando (commit=$commit status=$status, intento $attempt/40)"
              sleep 15
            done
            [ -n "$ok" ] || { echo "servicio $svc: el deployment de $DEPLOY_SHA no llegó a SUCCESS a tiempo ❌"; exit 1; }
          done

      - name: Verify semse-API health
        run: |
          curl -sf https://project-manager-app-production-977f.up.railway.app/v1/health \
            | grep -q '"status":"ok"' \
            && echo "semse-API healthy ✅" \
            || { echo "semse-API health check failed ❌"; exit 1; }

      - name: Verify semse-web
        run: |
          code=$(curl -so /dev/null -w "%{http_code}" \
            https://semse-web-production.up.railway.app/)
          [ "$code" = "200" ] \
            && echo "semse-web healthy ✅ (HTTP $code)" \
            || { echo "semse-web returned $code ❌"; exit 1; }

      # C02 — procedencia en RUNTIME. GATE BLOQUEANTE (antes informativo; dos ciclos
      # verdes con gitSha === DEPLOY_SHA en API y web: f59d1b0 y 7c9df29).
      # El paso "Verify fresh deployments" ya comprueba que Railway tiene el commit
      # exacto en SUCCESS; aqui se exige ademas que lo que CORRE (/v1/health y
      # /api/semse/healthz) responda 2xx y reporte el MISMO gitSha (igualdad exacta)
      # y un deploymentId. Discrepancia, campo desconocido, o health caido/sin
      # respuesta tras los reintentos => el job falla (nunca se acepta procedencia
      # desconocida). imageDigest "unknown" se tolera como WARNING (Railway no lo
      # expone al runtime) hasta que el build inyecte un digest verificable.
      - name: Checkout provenance verifier (sparse, read-only)
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.deploy.outputs.deploy_sha }}
          sparse-checkout: project-manager-app/scripts/verify-deploy-provenance.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Runtime provenance gate (blocking)
        env:
          DEPLOY_SHA: ${{ needs.deploy.outputs.deploy_sha }}
        run: |
          set -uo pipefail
          out=$(mktemp)
          rc=0
          node project-manager-app/scripts/verify-deploy-provenance.mjs \
            --url=https://project-manager-app-production-977f.up.railway.app --path=/v1/health \
            --expect-sha="$DEPLOY_SHA" --allow-unknown-digest --retries=6 --interval=10 \
            --markdown --label="semse-API" >> "$out" || rc=1
          node project-manager-app/scripts/verify-deploy-provenance.mjs \
            --url=https://semse-web-production.up.railway.app --path=/api/semse/healthz \
            --expect-sha="$DEPLOY_SHA" --allow-unknown-digest --retries=6 --interval=10 \
            --markdown --label="semse-web" >> "$out" || rc=1
          cat "$out" | tee -a "$GITHUB_STEP_SUMMARY"
          if grep -q "🟡" "$out"; then
            echo "::warning title=Procedencia en runtime::imageDigest desconocido (tolerado hasta inyectar un digest verificable)."
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::error title=Procedencia en runtime::producción no reporta gitSha === $DEPLOY_SHA o el health no respondió. El deploy se marca como fallido."
            exit 1
          fi
