name: Railway Deploy

# Gate único de despliegue y procedencia de producción (consolida #1143 + #1145).
#
# PROPUESTA C3/T5 (incidente 9e2f87f1, 2026-11-26) — NO APLICADA:
# - Sin RAILWAY_TOKEN válido el release es BLOCKED (antes continue-on-error).
# - Guardia forward-only bajo el lock `railway-deploy`: un CI antiguo que termina
#   tarde no despliega un SHA obsoleto (scripts/release-forward-guard.mjs).
# - Worker y Vision se verifican SIEMPRE por la API de Railway; API y Web,
#   además, en runtime. Un deployment SUCCESS no basta para API/Web.
# - El lock tiene cancel-in-progress:false; GitHub puede sustituir un run
#   PENDIENTE por otro más nuevo. Es aceptable aquí: el más nuevo incluye al
#   anterior (historia lineal) y la guardia bloquea cualquier retroceso.
#
# Realidad verificada 2026-11-12 (Railway, solo lectura): los 4 servicios tienen
# `checkSuites: false` → la integración nativa GitHub→Railway despliega CADA
# push a main SIN esperar a CI. Este workflow NO es lo que decide qué corre en
# producción: lo VERIFICA después de un CI verde y, si RAILWAY_TOKEN funciona,
# además fuerza un fresh build del SHA exacto. Un SHA cuyo CI falla lo vigila
# `production-unvalidated-deploy-alarm.yml`.
#
# serviceInstanceDeployV2(commitSha: SHA), SIN latestCommit, construye el SHA
# exacto. QA (G-R02, 27-nov-2026): serviceInstanceDeploy(latestCommit: true,
# commitSha) construyó otro commit (60bcff1c) y respondió true; V2 con
# commitSha hizo un build nuevo del SHA pedido.
#
# Rollback: re-ejecutar este workflow NO retrocede código; revertir el commit
# en main (git revert) y dejar que CI + este gate verifiquen el revert.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: railway-deploy
  cancel-in-progress: false

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # workflow_run: CI success de un push/dispatch sobre main DEL MISMO repo.
    # Sin la comprobación de evento y repositorio, la CI de un PR desde un fork
    # cuya rama se llame "main" cumpliría head_branch == 'main' y este job
    # correría con RAILWAY_TOKEN.
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main')
    outputs:
      deploy_sha: ${{ steps.resolve-sha.outputs.deploy_sha }}
      # deploy | already_served | superseded (blocked hace fallar el job).
      release_action: ${{ steps.forward-guard.outputs.action }}
    steps:
      - name: Resolve verified SHA
        id: resolve-sha
        env:
          # En workflow_run, GITHUB_SHA es la cabeza de la rama por defecto al
          # emitirse el evento; head_sha es el commit exacto evaluado por CI.
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            deploy_sha="$WORKFLOW_RUN_HEAD_SHA"
          else
            deploy_sha="$GITHUB_SHA"
          fi
          [[ "$deploy_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::SHA inválido: '$deploy_sha'"; exit 1; }
          echo "deploy_sha=$deploy_sha" >> "$GITHUB_OUTPUT"
          echo "SHA verificado por CI: $deploy_sha"

      # C3: sin credencial no hay release. Nunca PASS sin token: el job falla
      # como BLOCKED (antes: continue-on-error dejaba el job en verde).
      - name: Require Railway credential (fail closed)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "::error title=Release BLOCKED::RAILWAY_TOKEN ausente. No se despliega ni se acredita procedencia."
            exit 1
          fi
          # Comprobación de solo lectura de que la credencial autentica, sin imprimirla.
          code=$(curl -s -o /tmp/me.json -w '%{http_code}' -X POST https://backboard.railway.com/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" -H "Content-Type: application/json" \
            -d '{"query":"{ deployments(first: 1, input: { serviceId: \"2bd1bd3f-9aa1-4fc3-a714-4cf90c52c770\", environmentId: \"d682210a-956a-4508-9c5b-4ca5959278f9\" }) { edges { node { status } } } }"}' || echo 000)
          if [ "$code" != "200" ] || grep -q '"errors"' /tmp/me.json; then
            echo "::error title=Release BLOCKED::RAILWAY_TOKEN no autentica (HTTP $code). Renovar la credencial; no hay PASS sin ella."
            exit 1
          fi
          rm -f /tmp/me.json

      # Historia completa para la guardia forward-only y el preflight de
      # migraciones (C6). Sin filtro de blobs, porque el preflight lee los
      # migration.sql del rango servido..candidato y, con persist-credentials
      # en false, la descarga diferida de blobs fallaría (y el preflight
      # bloquearía). El árbol de trabajo solo contiene los tres scripts.
      - name: Checkout release guard (sparse, read-only)
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          sparse-checkout: |
            project-manager-app/scripts/verify-deploy-provenance.mjs
            project-manager-app/scripts/release-forward-guard.mjs
            project-manager-app/scripts/migration-destructive-preflight.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # T5: bajo el lock de concurrencia `railway-deploy`, justo antes de
      # disparar, se revalida que el candidato avanza linealmente sobre lo que
      # sirve la API. Un CI antiguo que termina tarde queda en superseded.
      - name: Forward-only guard (stale SHA protection)
        id: forward-guard
        env:
          DEPLOY_SHA: ${{ steps.resolve-sha.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          json=$(node project-manager-app/scripts/verify-deploy-provenance.mjs \
            --url=https://project-manager-app-production-977f.up.railway.app --path=/v1/health \
            --expect-sha="$DEPLOY_SHA" --allow-unknown-digest --retries=3 --interval=5 --timeout=5 || true)
          served=$(printf '%s' "$json" | jq -r '.observed.gitSha // "unknown"' 2>/dev/null || echo unknown)
          decision=$(node project-manager-app/scripts/release-forward-guard.mjs \
            --candidate="$DEPLOY_SHA" --served="$served") || rc=$?
          echo "$decision"
          action=$(printf '%s' "$decision" | jq -r .action)
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "served=$served" >> "$GITHUB_OUTPUT"
          echo "- Guardia forward-only: \`$action\` (servido: \`$served\`, candidato: \`$DEPLOY_SHA\`)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$action" = "blocked" ]; then
            echo "::error title=Release BLOCKED::$(printf '%s' "$decision" | jq -r .reason)"
            exit 1
          fi

      # C6 (SDD §9.2, G-R05 paso 3): un rollback de código no revierte la base.
      # Antes de disparar, se revisan las migraciones del rango servido..candidato.
      # Una migración destructiva, o una migración ya aplicada que se modifica o
      # se borra, bloquea el release salvo que figure en
      # packages/db/prisma/destructive-migrations.approved.json con approvedBy
      # y backupRef (revisado en el mismo PR). Fail closed si no se puede evaluar.
      - name: Destructive migration preflight (fail closed)
        if: steps.forward-guard.outputs.action == 'deploy' || steps.forward-guard.outputs.action == 'already_served'
        env:
          DEPLOY_SHA: ${{ steps.resolve-sha.outputs.deploy_sha }}
          SERVED_SHA: ${{ steps.forward-guard.outputs.served }}
        run: |
          set -euo pipefail
          rc=0
          pre=$(node project-manager-app/scripts/migration-destructive-preflight.mjs \
            --served="$SERVED_SHA" --candidate="$DEPLOY_SHA") || rc=$?
          echo "$pre"
          echo "- Preflight de migraciones: \`$(printf '%s' "$pre" | jq -r .action)\` ($(printf '%s' "$pre" | jq -r .reason))" >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" != "0" ]; then
            echo "::error title=Release BLOCKED::$(printf '%s' "$pre" | jq -r .reason)"
            exit 1
          fi

      # La guardia anterior mira solo la API. Aquí, por servicio, se compara el
      # SHA de su último deployment SUCCESS con el candidato: igual -> se omite;
      # el candidato avanza -> se despliega; el servicio va por delante o no se
      # puede probar el avance -> BLOCKED (nunca se hace retroceder un servicio).
      # Así, si la API ya sirve el candidato pero otro servicio falló, repetir
      # el release despliega solo los servicios rezagados.
      - name: Deploy exact commit to Railway (fresh build)
        if: steps.forward-guard.outputs.action == 'deploy' || steps.forward-guard.outputs.action == 'already_served'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          ENV_ID: d682210a-956a-4508-9c5b-4ca5959278f9
          DEPLOY_SHA: ${{ steps.resolve-sha.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          # semse-worker, semse-API, semse-web, semse-vision (proyecto SEMSEproject)
          services="26cd1c52-1a07-4f05-8b21-9a225e601d7a 2bd1bd3f-9aa1-4fc3-a714-4cf90c52c770 40ab1cd0-b0a6-4760-a43f-8742c1962ef7 63a901e8-189e-4748-97f7-b7e60e628ee2"
          # Paso 1: se decide por servicio ANTES de mutar nada. Si uno bloquea,
          # no se despliega ninguno (sin releases a medias por la guardia).
          to_deploy=""
          blocked=0
          for svc in $services; do
            qbody=$(jq -nc --arg s "$svc" --arg e "$ENV_ID" \
              '{query:"query($s:String!,$e:String!){ deployments(first: 10, input:{serviceId:$s, environmentId:$e}) { edges { node { status meta } } } }", variables:{s:$s,e:$e}}')
            svc_served=$(curl -sf -X POST https://backboard.railway.com/graphql/v2 \
              -H "Authorization: Bearer $RAILWAY_TOKEN" -H "Content-Type: application/json" --data "$qbody" \
              | jq -r '[.data.deployments.edges[].node | select(.status == "SUCCESS")] | first | .meta.commitHash // "unknown"' 2>/dev/null) \
              || svc_served=unknown
            [ -n "$svc_served" ] || svc_served=unknown
            src=0
            svc_decision=$(node project-manager-app/scripts/release-forward-guard.mjs \
              --candidate="$DEPLOY_SHA" --served="$svc_served") || src=$?
            svc_action=$(printf '%s' "$svc_decision" | jq -r .action 2>/dev/null) || svc_action=blocked
            echo "- Servicio \`$svc\`: \`$svc_action\` (servido: \`$svc_served\`)" >> "$GITHUB_STEP_SUMMARY"
            case "$svc_action" in
              already_served)
                echo "Servicio $svc ya sirve $DEPLOY_SHA; se omite" ;;
              deploy)
                to_deploy="$to_deploy $svc" ;;
              *)
                echo "::error title=Release BLOCKED::servicio $svc: $svc_action ($(printf '%s' "$svc_decision" | jq -r .reason 2>/dev/null)). No se hace retroceder un servicio."
                blocked=1 ;;
            esac
          done
          [ "$blocked" = "0" ] || exit 1
          # Paso 2: solo los servicios rezagados reciben el commit exacto.
          for svc in $to_deploy; do
            body=$(jq -nc --arg s "$svc" --arg e "$ENV_ID" --arg c "$DEPLOY_SHA" \
              '{query:"mutation($s:String!,$e:String!,$c:String!){ serviceInstanceDeployV2(serviceId:$s, environmentId:$e, commitSha:$c) }", variables:{s:$s,e:$e,c:$c}}')
            response=$(curl -sf -X POST https://backboard.railway.com/graphql/v2 \
              -H "Authorization: Bearer $RAILWAY_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$body")
            if echo "$response" | jq -e '.errors' >/dev/null 2>&1; then
              echo "::error title=Release BLOCKED::GraphQL errors for $svc"; exit 1
            fi
            dep=$(echo "$response" | jq -r '.data.serviceInstanceDeployV2 // empty')
            [ -n "$dep" ] \
              || { echo "::error title=Release BLOCKED::Deploy failed for service $svc"; exit 1; }
            echo "Deployment $dep de $DEPLOY_SHA disparado para servicio $svc"
          done

  health-check:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    # Solo lectura: trae el verificador (C02) y consulta la cabeza de main.
    permissions:
      contents: read
    steps:
      # Historia sin blobs para resolver el SHA esperado por watchPatterns; el
      # árbol de trabajo solo contiene el verificador.
      - name: Checkout provenance verifier (sparse, read-only)
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            project-manager-app/scripts/verify-deploy-provenance.mjs
            project-manager-app/scripts/release-forward-guard.mjs
            project-manager-app/scripts/verify-worker-startup-log.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # La guardia forward-only del job deploy ya decidió: superseded significa
      # que producción sirve un SHA posterior; lo acredita el run de ese SHA.
      - name: Skip when production already serves a newer SHA
        id: superseded
        env:
          RELEASE_ACTION: ${{ needs.deploy.outputs.release_action }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_ACTION" = "superseded" ]; then
            echo "::notice title=Health gate::producción ya sirve un SHA posterior; lo acredita el run de ese SHA."
            echo "superseded=true" >> "$GITHUB_OUTPUT"
          else
            echo "superseded=false" >> "$GITHUB_OUTPUT"
          fi

      # API/Web/Worker usan watchPatterns ["project-manager-app/**"]: un commit
      # que solo toca .github/ o la raíz NO se reconstruye por la vía nativa y
      # producción sigue sirviendo el último commit que tocó esa ruta. Con el
      # token, serviceInstanceDeployV2(commitSha) fuerza el build del SHA exacto.
      - name: Resolve SHA production must serve
        id: expected
        if: steps.superseded.outputs.superseded != 'true'
        env:
          DEPLOY_SHA: ${{ needs.deploy.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          # serviceInstanceDeployV2(commitSha) construye el SHA exacto aunque no
          # toque project-manager-app/** (watchPatterns solo afecta a la vía nativa).
          expected="$DEPLOY_SHA"
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::No se pudo resolver el SHA esperado"; exit 1; }
          echo "sha=$expected" >> "$GITHUB_OUTPUT"
          echo "SHA que producción debe servir: $expected"

      # Siempre (el token es obligatorio): la URL pública responde con el
      # deployment ANTERIOR mientras el nuevo compila; aquí se exige el
      # deployment exacto en SUCCESS para los 4 servicios. Para Worker y Vision
      # es la única evidencia disponible: metadata de Railway, NO runtime.
      - name: Verify fresh deployments reached SUCCESS
        if: steps.superseded.outputs.superseded != 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          ENV_ID: d682210a-956a-4508-9c5b-4ca5959278f9
          DEPLOY_SHA: ${{ needs.deploy.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          for svc in \
            26cd1c52-1a07-4f05-8b21-9a225e601d7a \
            2bd1bd3f-9aa1-4fc3-a714-4cf90c52c770 \
            40ab1cd0-b0a6-4760-a43f-8742c1962ef7 \
            63a901e8-189e-4748-97f7-b7e60e628ee2; do
            ok=""
            for attempt in $(seq 1 40); do
              response=$(curl -sf -X POST https://backboard.railway.com/graphql/v2 \
                -H "Authorization: Bearer $RAILWAY_TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"query\":\"{ deployments(first: 1, input: { serviceId: \\\"$svc\\\", environmentId: \\\"$ENV_ID\\\" }) { edges { node { status meta } } } }\"}") || { sleep 15; continue; }
              status=$(echo "$response" | grep -o '"status":"[A-Z_]*"' | head -1 | cut -d'"' -f4)
              commit=$(echo "$response" | grep -o '"commitHash":"[a-f0-9]*"' | head -1 | cut -d'"' -f4)
              if [ "$commit" = "$DEPLOY_SHA" ] && [ "$status" = "SUCCESS" ]; then
                echo "servicio $svc: deployment de $DEPLOY_SHA en SUCCESS ✅"; ok=1; break
              fi
              if [ "$commit" = "$DEPLOY_SHA" ] && { [ "$status" = "FAILED" ] || [ "$status" = "CRASHED" ]; }; then
                echo "servicio $svc: deployment de $DEPLOY_SHA terminó en $status ❌"; exit 1
              fi
              echo "servicio $svc: esperando (commit=$commit status=$status, intento $attempt/40)"
              sleep 15
            done
            [ -n "$ok" ] || { echo "servicio $svc: el deployment de $DEPLOY_SHA no llegó a SUCCESS a tiempo ❌"; exit 1; }
          done

      # C7 (G-R06): el Worker no tiene HTTP. Su procedencia en runtime sale del
      # log de arranque (label startup, apps/worker/src/main.mjs) del deployment
      # exacto de DEPLOY_SHA. Bloqueante: sin ese log, o con otro SHA, falla.
      # Vision sigue verificándose solo por metadata de Railway (no runtime).
      - name: Worker runtime provenance (startup log, blocking)
        if: steps.superseded.outputs.superseded != 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          ENV_ID: d682210a-956a-4508-9c5b-4ca5959278f9
          WORKER_ID: 26cd1c52-1a07-4f05-8b21-9a225e601d7a
          DEPLOY_SHA: ${{ needs.deploy.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          api=https://backboard.railway.com/graphql/v2
          body=$(jq -nc --arg s "$WORKER_ID" --arg e "$ENV_ID" \
            '{query:"query($s:String!,$e:String!){ deployments(first: 10, input:{serviceId:$s, environmentId:$e}) { edges { node { id status meta } } } }", variables:{s:$s,e:$e}}')
          wdep=$(curl -sS "$api" -H "Authorization: Bearer $RAILWAY_TOKEN" -H "Content-Type: application/json" --data "$body" \
            | jq -r --arg c "$DEPLOY_SHA" '[.data.deployments.edges[].node | select(.meta.commitHash == $c and .status == "SUCCESS")] | first | .id // empty')
          [ -n "$wdep" ] || { echo "::error title=Health gate::sin deployment SUCCESS del Worker para $DEPLOY_SHA"; exit 1; }
          for i in $(seq 1 20); do
            lbody=$(jq -nc --arg d "$wdep" '{query:"query($d:String!){ deploymentLogs(deploymentId:$d, filter:\"@label:startup\", limit:20) { timestamp attributes { key value } } }", variables:{d:$d}}')
            rc=0
            wv=$(curl -sS "$api" -H "Authorization: Bearer $RAILWAY_TOKEN" -H "Content-Type: application/json" --data "$lbody" \
              | node project-manager-app/scripts/verify-worker-startup-log.mjs --expect-sha="$DEPLOY_SHA" --deployment-id="$wdep") || rc=$?
            echo "[$i] $wv"
            verdict=$(printf '%s' "$wv" | jq -r .verdict 2>/dev/null || echo INVALID)
            if [ "$verdict" = "VERIFIED" ]; then
              echo "- Worker: \`$wdep\` VERIFIED en runtime (log de arranque)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            [ "$verdict" = "MISMATCH" ] && break
            sleep 15
          done
          echo "::error title=Health gate::el Worker no informa $DEPLOY_SHA en su log de arranque ($wdep)"
          exit 1

      # C02 — procedencia en RUNTIME, BLOQUEANTE y sin token. /v1/health y
      # /api/semse/healthz deben responder 2xx con gitSha === SHA esperado
      # (igualdad exacta) y deploymentId/environment conocidos. imageDigest
      # "unknown" se tolera como WARNING (Railway no lo expone al runtime).
      - name: Runtime provenance gate (blocking, API + Web in parallel)
        if: steps.superseded.outputs.superseded != 'true'
        env:
          EXPECTED_SHA: ${{ steps.expected.outputs.sha }}
        run: |
          set -uo pipefail
          api_out=$(mktemp); web_out=$(mktemp)
          # El paso anterior ya esperó al SUCCESS: 6 x 10 s bastan.
          retries=6; interval=10
          node project-manager-app/scripts/verify-deploy-provenance.mjs \
            --url=https://project-manager-app-production-977f.up.railway.app --path=/v1/health \
            --expect-sha="$EXPECTED_SHA" --allow-unknown-digest --retries="$retries" --interval="$interval" --timeout=5 \
            --markdown --label="semse-API" > "$api_out" 2>&1 &
          api_pid=$!
          node project-manager-app/scripts/verify-deploy-provenance.mjs \
            --url=https://semse-web-production.up.railway.app --path=/api/semse/healthz \
            --expect-sha="$EXPECTED_SHA" --allow-unknown-digest --retries="$retries" --interval="$interval" --timeout=5 \
            --markdown --label="semse-web" > "$web_out" 2>&1 &
          web_pid=$!
          api_rc=0; wait "$api_pid" || api_rc=$?
          web_rc=0; wait "$web_pid" || web_rc=$?
          cat "$api_out" "$web_out" | tee -a "$GITHUB_STEP_SUMMARY"
          if grep -q "🟡" "$api_out" "$web_out"; then
            echo "::warning title=Procedencia en runtime::imageDigest desconocido (tolerado hasta inyectar un digest verificable)."
          fi
          if [ "$api_rc" -eq 0 ] && [ "$web_rc" -eq 0 ]; then
            echo "API y Web sirven $EXPECTED_SHA ✅"; exit 0
          fi
          # Solo se cede la verificación si producción ya sirve un SHA POSTERIOR
          # (prueba positiva de la guardia). Que main haya avanzado no basta:
          # antes esto daba PASS sin evidencia.
          # El verificador sale con 1 cuando el SHA difiere (justo el caso que
          # interesa aquí): se captura su salida aparte y se tolera ese código,
          # para que pipefail no añada «unknown» al SHA observado.
          vjson=$(node project-manager-app/scripts/verify-deploy-provenance.mjs \
            --url=https://project-manager-app-production-977f.up.railway.app --path=/v1/health \
            --expect-sha="$EXPECTED_SHA" --allow-unknown-digest --retries=1 --timeout=5 2>/dev/null || true)
          served=$(printf '%s' "$vjson" | jq -r '.observed.gitSha // "unknown"' 2>/dev/null) || served=unknown
          [ -n "$served" ] || served=unknown
          action=$(node project-manager-app/scripts/release-forward-guard.mjs \
            --candidate="$EXPECTED_SHA" --served="$served" | jq -r .action || echo blocked)
          if [ "$action" = "superseded" ]; then
            echo "::notice title=Health gate::producción ya sirve $served, posterior a $EXPECTED_SHA; lo acredita el run de ese SHA."
            exit 0
          fi
          echo "::error title=Procedencia en runtime::producción no reporta gitSha === $EXPECTED_SHA o el health no respondió. No se acredita el despliegue."
          exit 1

      - name: Scope of this gate
        if: always()
        run: |
          {
            echo "### Alcance"
            echo "- API y Web: procedencia en runtime por endpoints públicos (bloqueante)."
            echo "- Worker y Vision: deployment del SHA exacto en SUCCESS vía API de Railway (metadata, no runtime)."
            echo "- imageDigest: tolerado como desconocido; requiere excepción formal hasta inyectar un digest verificable."
            echo "- Mientras la vía nativa siga conectada (checkSuites:false), Railway puede servir main ANTES de este gate; ver la alarma."
          } >> "$GITHUB_STEP_SUMMARY"
