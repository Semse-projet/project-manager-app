name: Prometeo P0 Inventory Static Tests

on:
  pull_request:
    paths:
      - "project-manager-app/scripts/audits/prometeo_p0/**"
      - ".github/workflows/prometeo-p0-inventory-static.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-inventory-contract:
    name: Offline audit contract (NO database)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest only
        run: python -m pip install --disable-pip-version-check pytest==8.4.2
      - name: Run synthetic evaluator and SQL static tests
        working-directory: project-manager-app/scripts/audits/prometeo_p0
        run: python -m pytest -q test_evaluator.py test_sql_contract.py

# This workflow is deliberately static-only: NO DATABASE_URL, no credentials,
# no production service access, no SQL execution, no sharing flag changes.
