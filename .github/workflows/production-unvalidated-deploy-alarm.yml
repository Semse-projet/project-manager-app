name: Production Unvalidated Deploy Alarm

# Railway despliega cada push a main SIN esperar a CI (checkSuites:false en los
# 4 servicios, revalidado 2026-11-26) y semse-API ejecuta pre-migrate antes de
# cada deploy. Esta alarma, de solo lectura y sin secretos, es una defensa
# SECUNDARIA: no despliega, no hace rollback y no toca Railway.
#
# PROPUESTA C4 (incidente 9e2f87f1, 2026-11-26) — NO APLICADA:
# - `ci-not-green`: tras un CI de main no exitoso, vigila API y Web y reporta
#   TODOS los servicios que sirven el SHA (antes salía en el primero).
# - `served-before-ci`: desde que se solicita el CI de main, detecta si API o
#   Web sirven el SHA ANTES de que su CI termine en success (antes no se
#   detectaba: 0ae2c319 estuvo ~8 min en producción antes de su CI verde).
# - Worker y Vision no tienen endpoint público de procedencia: el resumen los
#   declara NO observables; su verificación vive en railway-deploy.yml.
#
# Va en un workflow aparte a propósito: si fuera un job de `Railway Deploy`,
# una alarma verde dejaría ese workflow en success y dispararía
# `Production Health Gate` (deploy.yml) como si hubiera un deploy validado.
on:
  workflow_run:
    workflows: ["CI"]
    types: [requested, completed]

permissions: {}

jobs:
  ci-not-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    if: >-
      github.event.action == 'completed' &&
      github.event.workflow_run.conclusion != 'success' &&
      github.event.workflow_run.conclusion != 'skipped' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      contents: read
    steps:
      # Verificador desde la cabeza de main (no ejecuta código del SHA rojo).
      - name: Checkout watcher (sparse, read-only)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            project-manager-app/scripts/verify-deploy-provenance.mjs
            project-manager-app/scripts/unvalidated-deploy-watch.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Watch whether production serves the CI-failed SHA (all targets)
        env:
          FAILED_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          [[ "$FAILED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::SHA inválido"; exit 1; }
          # Vision no declara watchPatterns (revalidado 2026-11-26): un commit
          # fuera de project-manager-app/** puede desplegarse igualmente, así
          # que ya no se sale antes por esa razón; solo se anota.
          if [ -z "$(git diff --name-only "${FAILED_SHA}^1" "$FAILED_SHA" -- project-manager-app/)" ]; then
            echo "::notice title=Alarma::$FAILED_SHA no toca project-manager-app/**; API/Web/Worker no deberían reconstruirlo, Vision puede."
          fi
          echo "CI de $FAILED_SHA terminó en '$CI_CONCLUSION'. Vigilando API y Web hasta 20 min."
          seen=""
          # Plazo de reloj (no número de rondas): una sonda que agota su timeout
          # alarga cada ronda, y el resumen debe escribirse antes del límite del job.
          deadline=$((SECONDS + 1200))
          while [ "$SECONDS" -lt "$deadline" ]; do
            out=$(node project-manager-app/scripts/unvalidated-deploy-watch.mjs --sha="$FAILED_SHA" \
              --target="semse-API|https://project-manager-app-production-977f.up.railway.app|/v1/health" \
              --target="semse-web|https://semse-web-production.up.railway.app|/api/semse/healthz" || echo '{"hits":[]}')
            for label in $(printf '%s' "$out" | jq -r '.hits[]'); do
              case " $seen " in *" $label "*) ;; *)
                seen="$seen $label"
                # Aviso inmediato en la primera coincidencia de cada servicio.
                echo "::error title=Despliegue no validado::$label sirve $FAILED_SHA, cuyo CI terminó en '$CI_CONCLUSION' ($(date -u +%FT%TZ))."
                ;;
              esac
            done
            sleep 15
          done
          {
            echo "### Alarma de despliegue no validado"
            echo "- SHA: \`$FAILED_SHA\` (CI: $CI_CONCLUSION)"
            echo "- Servicios que lo sirvieron en la ventana: ${seen:-ninguno observado}"
            echo "- Worker y Vision: **no observables** por esta alarma (sin endpoint público). Con CI rojo, Railway Deploy no corre, así que no hay otra verificación automática de esos dos servicios: revisarlos a mano en Railway."
            echo "- La ventana vigilada (20 min) no prueba que no se sirva después."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$seen" ]; then
            echo "::error title=Despliegue no validado::${seen# } sirvieron $FAILED_SHA, cuyo CI terminó en '$CI_CONCLUSION'. Remediación humana: revertir en main; revisar migraciones aplicadas por pre-migrate."
            exit 1
          fi

  served-before-ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    if: >-
      github.event.action == 'requested' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout watcher (sparse, read-only)
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            project-manager-app/scripts/verify-deploy-provenance.mjs
            project-manager-app/scripts/unvalidated-deploy-watch.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # Mientras el CI de este SHA no haya terminado en success, cualquier
      # observación del SHA en API o Web es un despliegue adelantado a CI.
      - name: Detect production serving the SHA before CI success
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::SHA inválido"; exit 1; }
          early=""
          deadline=$((SECONDS + 2400))
          while [ "$SECONDS" -lt "$deadline" ]; do
            read -r status conclusion < <(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
              --jq '[.status, (.conclusion // "none")] | @tsv')
            if [ "$status" = "completed" ]; then
              echo "CI de $SHA terminó: $conclusion."; break
            fi
            out=$(node project-manager-app/scripts/unvalidated-deploy-watch.mjs --sha="$SHA" \
              --target="semse-API|https://project-manager-app-production-977f.up.railway.app|/v1/health" \
              --target="semse-web|https://semse-web-production.up.railway.app|/api/semse/healthz" || echo '{"hits":[]}')
            for label in $(printf '%s' "$out" | jq -r '.hits[]'); do
              case " $early " in *" $label "*) ;; *) early="$early $label"; echo "::error title=Servido antes de CI::$label sirve $SHA con CI '$status' ($(date -u +%FT%TZ))";; esac
            done
            sleep 15
          done
          {
            echo "### Servido antes de CI success"
            echo "- SHA: \`$SHA\` — servicios observados antes de CI success: ${early:-ninguno}"
            echo "- Worker y Vision: **no observables** por esta alarma (sin endpoint público); revisarlos a mano en Railway."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$early" ]; then
            echo "::error title=Servido antes de CI::${early# } sirvieron $SHA antes de que su CI terminara en success."
            exit 1
          fi
