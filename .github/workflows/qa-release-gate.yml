# QA release gate: arnés de prueba de la opción B (G-R02 a G-R04, G-R06).
#
# Reproduce en QA aislado (proyecto "SEMSE AgentRun 1149 Isolated QA",
# entorno staging) la vía única de release propuesta en ADR-PROV-001:
#   CI por SHA (C2) -> release serializado -> credencial obligatoria ->
#   guardia forward-only (C3) -> serviceInstanceDeploy(commitSha) ->
#   verificación por servicio (Railway + runtime).
#
# Diferencia con producción (documentada en la evidencia): workflow_run solo
# se dispara con workflows de la rama por defecto, así que en QA el release
# es un job `needs: ci` del mismo workflow con concurrencia propia, en lugar
# de un workflow_run aparte. La lógica (guardia, credencial, verificación)
# es la misma.
#
# Solo corre con commits cuyo mensaje contiene "[gr]". Marcadores:
#   [gr:fail]       el CI falla a propósito
#   [gr:sleep=N]    el CI espera N segundos antes de terminar
#   [gr:no-token]   el release se ejecuta sin credencial (G-R04)
#   [gr:bad-health] la guardia consulta una ruta inexistente: SHA servido
#                   desconocido, simula el endpoint caído (G-R03 paso 3)
#   [gr:api-only]   en el primer intento solo se despliega la API (release a
#                   medias); un re-run debe desplegar solo el Worker (G-R08)
#
# G-R08 (revisión de #1199): el release replica los pasos del job deploy de
# producción tras la revisión: selección del SHA verde más avanzado bajo el
# lock, guardia, preflight con intentos fallidos y decisión por servicio.
# Nunca usa IDs ni credenciales de producción.
name: QA release gate

on:
  push:
    branches: [qa/release-gate]

permissions:
  contents: read
  actions: read

# C2: un grupo por SHA, nunca se cancela un run de otro SHA.
concurrency:
  group: qa-ci-sha-${{ github.sha }}
  cancel-in-progress: false

env:
  RAILWAY_API: https://backboard.railway.com/graphql/v2
  QA_PROJECT_ID: dc1754a3-5563-4274-a81d-5be976911064
  QA_ENVIRONMENT_ID: 159babb8-2eef-4971-87ad-1a7594ca022f
  QA_API_SERVICE_ID: 3fe904d1-0810-4024-84bb-f0b4180dace4
  QA_WORKER_SERVICE_ID: 1f91503b-f7d0-435e-b831-9be4996aac47
  QA_API_URL: https://semse-api-qa-staging.up.railway.app

jobs:
  ci:
    if: contains(github.event.head_commit.message, '[gr]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Scenario
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          echo "SHA: $GITHUB_SHA"
          sleep_s=$(printf '%s' "$MSG" | grep -oE '\[gr:sleep=[0-9]+\]' | grep -oE '[0-9]+' || true)
          if [ -n "${sleep_s:-}" ]; then echo "Esperando ${sleep_s}s"; sleep "$sleep_s"; fi
          if printf '%s' "$MSG" | grep -q '\[gr:fail\]'; then
            echo "::error title=QA CI::fallo intencionado ([gr:fail])"
            exit 1
          fi
          echo "CI de QA en verde para $GITHUB_SHA"

  release:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: qa-release-gate
    # Un único release activo. GitHub puede sustituir un release pendiente.
    concurrency:
      group: qa-railway-deploy
      cancel-in-progress: false
    env:
      DEPLOY_SHA: ${{ github.sha }}
      MSG: ${{ github.event.head_commit.message }}
    steps:
      - name: Checkout (historia completa para la guardia)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require Railway credential (fail closed)
        env:
          RAILWAY_QA_TOKEN: ${{ secrets.RAILWAY_QA_TOKEN }}
        run: |
          set -euo pipefail
          tok="$RAILWAY_QA_TOKEN"
          if printf '%s' "$MSG" | grep -q '\[gr:no-token\]'; then tok=""; echo "Escenario sin credencial"; fi
          if [ -z "$tok" ]; then
            echo "::error title=Release BLOCKED::credencial ausente. No se despliega."
            exit 1
          fi
          code=$(curl -sS -o cred.json -w '%{http_code}' "$RAILWAY_API" \
            -H "Project-Access-Token: $tok" -H "Content-Type: application/json" \
            --data '{"query":"query { projectToken { projectId environmentId } }"}' || echo 000)
          if [ "$code" != "200" ] || jq -e '.errors' cred.json >/dev/null 2>&1; then
            echo "::error title=Release BLOCKED::la credencial no autentica (HTTP $code)."
            exit 1
          fi
          [ "$(jq -r .data.projectToken.projectId cred.json)" = "$QA_PROJECT_ID" ] \
            && [ "$(jq -r .data.projectToken.environmentId cred.json)" = "$QA_ENVIRONMENT_ID" ] \
            || { echo "::error title=Release BLOCKED::la credencial no es de QA staging."; exit 1; }
          echo "Credencial válida y acotada a QA staging."

      # Bajo el lock: el run pendiente puede ser de un commit más antiguo que
      # otro ya validado. Se despliega el SHA más avanzado con CI verde que
      # desciende del candidato. En QA el CI es el job `ci` de este workflow
      # (en producción, el workflow CI): se lee la conclusión de ese job.
      - name: Select most advanced CI-green SHA
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ github.sha }}
        run: |
          set -euo pipefail
          runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/qa-release-gate.yml/runs?branch=qa/release-gate&event=push&per_page=30" \
            --jq '.workflow_runs[] | select(.head_repository.full_name == "'"$GITHUB_REPOSITORY"'") | "\(.id) \(.head_sha)"') \
            || { echo "::error title=Release BLOCKED::no se pudo listar los runs"; exit 1; }
          green=""
          while read -r rid sha; do
            [ -n "$rid" ] || continue
            c=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$rid/jobs?filter=latest" --jq '[.jobs[] | select(.name == "ci")] | first | .conclusion // "none"' || echo none)
            [ "$c" = "success" ] && green="$green $sha"
          done <<< "$runs"
          printf '%s\n' $green > "$RUNNER_TEMP/ci-green.txt"
          if ! printf '%s\n' $green | grep -qx "$CANDIDATE"; then
            echo "::error title=Release BLOCKED::$CANDIDATE no tiene CI en success. No se despliega sin CI."
            exit 1
          fi
          best="$CANDIDATE"
          for sha in $green; do
            [ "$sha" = "$best" ] && continue
            if git merge-base --is-ancestor "$best" "$sha" 2>/dev/null; then best="$sha"; fi
          done
          [ "$best" = "$CANDIDATE" ] || echo "::notice title=Release::se despliega $best (CI verde, posterior a $CANDIDATE)"
          echo "deploy_sha=$best" >> "$GITHUB_OUTPUT"
          {
            echo "## QA release gate (G-R08)"
            echo "- Evento: \`$CANDIDATE\`; SHA elegido: \`$best\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Forward-only guard
        id: guard
        env:
          DEPLOY_SHA: ${{ steps.select.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          hpath=/v1/health
          if printf '%s' "$MSG" | grep -q '\[gr:bad-health\]'; then hpath=/v1/__gr_missing; echo "Escenario: endpoint de procedencia inaccesible"; fi
          json=$(node project-manager-app/scripts/verify-deploy-provenance.mjs \
            --url="$QA_API_URL" --path="$hpath" --expect-sha="$DEPLOY_SHA" \
            --allow-unknown-digest --retries=3 --interval=5 --timeout=5 || true)
          served=$(printf '%s' "$json" | jq -r '.observed.gitSha // "unknown"' 2>/dev/null) || served=unknown
          [ -n "$served" ] || served=unknown
          rc=0
          decision=$(node project-manager-app/scripts/release-forward-guard.mjs \
            --candidate="$DEPLOY_SHA" --served="$served") || rc=$?
          echo "$decision"
          action=$(printf '%s' "$decision" | jq -r .action)
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "served=$served" >> "$GITHUB_OUTPUT"
          {
            echo "- Servido antes (API QA): \`$served\`"
            echo "- Guardia (API): \`$action\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$action" = "blocked" ]; then
            echo "::error title=Release BLOCKED::$(printf '%s' "$decision" | jq -r .reason)"
            exit 1
          fi
          if [ "$action" = "superseded" ] && ! grep -qx "$served" "$RUNNER_TEMP/ci-green.txt"; then
            echo "::error title=Release BLOCKED::QA sirve $served, posterior a $DEPLOY_SHA, sin CI en success. No se acredita."
            exit 1
          fi

      # C6: misma lógica que producción, incluidos los intentos FAILED/CRASHED
      # de la API posteriores al deployment activo.
      - name: Destructive migration preflight (fail closed)
        if: steps.guard.outputs.action == 'deploy' || steps.guard.outputs.action == 'already_served'
        env:
          RAILWAY_QA_TOKEN: ${{ secrets.RAILWAY_QA_TOKEN }}
          DEPLOY_SHA: ${{ steps.select.outputs.deploy_sha }}
          SERVED_SHA: ${{ steps.guard.outputs.served }}
        run: |
          set -euo pipefail
          qbody=$(jq -nc --arg s "$QA_API_SERVICE_ID" --arg e "$QA_ENVIRONMENT_ID" \
            '{query:"query($s:String!,$e:String!){ deployments(first: 20, input:{serviceId:$s, environmentId:$e}) { edges { node { status meta } } } }", variables:{s:$s,e:$e}}')
          resp=$(curl -sf -X POST "$RAILWAY_API" \
            -H "Project-Access-Token: $RAILWAY_QA_TOKEN" -H "Content-Type: application/json" --data "$qbody") \
            || { echo "::error title=Release BLOCKED::no se pudo leer el historial de deployments de la API"; exit 1; }
          attempts=$(printf '%s' "$resp" | jq -r '
            [.data.deployments.edges[].node] as $n
            | ([$n | to_entries[] | select(.value.status == "SUCCESS") | .key] | first // ($n | length)) as $cut
            | $n[:$cut][] | select(.status == "FAILED" or .status == "CRASHED") | .meta.commitHash // empty' | sort -u) \
            || { echo "::error title=Release BLOCKED::historial de deployments ilegible"; exit 1; }
          bases="$SERVED_SHA"
          for c in $attempts; do
            [ "$c" = "$SERVED_SHA" ] || [ "$c" = "$DEPLOY_SHA" ] && continue
            bases="$bases $c"
          done
          rc=0
          for base in $bases; do
            brc=0
            pre=$(node project-manager-app/scripts/migration-destructive-preflight.mjs \
              --served="$base" --candidate="$DEPLOY_SHA") || brc=$?
            echo "$base..$DEPLOY_SHA: $pre"
            echo "- Preflight \`$base..$DEPLOY_SHA\`: \`$(printf '%s' "$pre" | jq -r .action)\` ($(printf '%s' "$pre" | jq -r .reason))" >> "$GITHUB_STEP_SUMMARY"
            if [ "$brc" != "0" ]; then
              echo "::error title=Release BLOCKED::$base..$DEPLOY_SHA: $(printf '%s' "$pre" | jq -r .reason)"
              rc=1
            fi
          done
          exit "$rc"

      # Por servicio, contra su último deployment SUCCESS, y antes de mutar nada.
      - name: Deploy exact commit (API y Worker de QA)
        if: steps.guard.outputs.action == 'deploy' || steps.guard.outputs.action == 'already_served'
        env:
          RAILWAY_QA_TOKEN: ${{ secrets.RAILWAY_QA_TOKEN }}
          DEPLOY_SHA: ${{ steps.select.outputs.deploy_sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          to_deploy=""
          blocked=0
          for svc in "$QA_API_SERVICE_ID" "$QA_WORKER_SERVICE_ID"; do
            qbody=$(jq -nc --arg s "$svc" --arg e "$QA_ENVIRONMENT_ID" \
              '{query:"query($s:String!,$e:String!){ deployments(first: 10, input:{serviceId:$s, environmentId:$e}) { edges { node { status meta } } } }", variables:{s:$s,e:$e}}')
            svc_served=$(curl -sf -X POST "$RAILWAY_API" \
              -H "Project-Access-Token: $RAILWAY_QA_TOKEN" -H "Content-Type: application/json" --data "$qbody" \
              | jq -r '[.data.deployments.edges[].node | select(.status == "SUCCESS")] | first | .meta.commitHash // "unknown"' 2>/dev/null) \
              || svc_served=unknown
            [ -n "$svc_served" ] || svc_served=unknown
            src=0
            svc_decision=$(node project-manager-app/scripts/release-forward-guard.mjs \
              --candidate="$DEPLOY_SHA" --served="$svc_served") || src=$?
            svc_action=$(printf '%s' "$svc_decision" | jq -r .action 2>/dev/null) || svc_action=blocked
            echo "- Servicio \`$svc\`: \`$svc_action\` (servido: \`$svc_served\`)" >> "$GITHUB_STEP_SUMMARY"
            case "$svc_action" in
              already_served) echo "Servicio $svc ya sirve $DEPLOY_SHA; se omite" ;;
              deploy) to_deploy="$to_deploy $svc" ;;
              *) echo "::error title=Release BLOCKED::servicio $svc: $svc_action ($(printf '%s' "$svc_decision" | jq -r .reason 2>/dev/null))"; blocked=1 ;;
            esac
          done
          [ "$blocked" = "0" ] || exit 1
          if printf '%s' "$MSG" | grep -q '\[gr:api-only\]' && [ "$RUN_ATTEMPT" = "1" ]; then
            echo "Escenario [gr:api-only], intento 1: solo la API (release a medias)"
            to_deploy=$(printf '%s\n' $to_deploy | grep -x "$QA_API_SERVICE_ID" || true)
          fi
          for svc in $to_deploy; do
            body=$(jq -nc --arg s "$svc" --arg e "$QA_ENVIRONMENT_ID" --arg c "$DEPLOY_SHA" \
              '{query:"mutation($s:String!,$e:String!,$c:String!){ serviceInstanceDeployV2(serviceId:$s, environmentId:$e, commitSha:$c) }", variables:{s:$s,e:$e,c:$c}}')
            resp=$(curl -sS "$RAILWAY_API" -H "Project-Access-Token: $RAILWAY_QA_TOKEN" \
              -H "Content-Type: application/json" --data "$body")
            dep=$(printf '%s' "$resp" | jq -r '.data.serviceInstanceDeployV2 // empty')
            if [ -z "$dep" ]; then
              echo "::error title=Release FAILED::serviceInstanceDeployV2 rechazado para $svc"
              printf '%s' "$resp" | jq -c '.errors // empty | map(.message)' || true
              exit 1
            fi
            echo "Deploy de $DEPLOY_SHA disparado en $svc: deployment $dep"
            echo "- Disparado \`$dep\` en \`$svc\`" >> "$GITHUB_STEP_SUMMARY"
          done
          if printf '%s' "$MSG" | grep -q '\[gr:api-only\]' && [ "$RUN_ATTEMPT" = "1" ]; then
            echo "::error title=Release FAILED::release a medias simulado ([gr:api-only]); repetir el job"
            exit 1
          fi

      - name: Verify per service (Railway metadata + runtime)
        if: steps.guard.outputs.action == 'deploy' || steps.guard.outputs.action == 'already_served'
        env:
          RAILWAY_QA_TOKEN: ${{ secrets.RAILWAY_QA_TOKEN }}
          DEPLOY_SHA: ${{ steps.select.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          verify_svc() {
            local svc="$1" name="$2"
            for i in $(seq 1 60); do
              body=$(jq -nc --arg s "$svc" --arg e "$QA_ENVIRONMENT_ID" \
                '{query:"query($s:String!,$e:String!){ deployments(first: 10, input:{serviceId:$s, environmentId:$e}) { edges { node { id status meta } } } }", variables:{s:$s,e:$e}}')
              resp=$(curl -sS "$RAILWAY_API" -H "Project-Access-Token: $RAILWAY_QA_TOKEN" \
                -H "Content-Type: application/json" --data "$body")
              row=$(printf '%s' "$resp" | jq -c --arg c "$DEPLOY_SHA" \
                '[.data.deployments.edges[].node | select(.meta.commitHash == $c)] | first // empty')
              [ -n "$row" ] || row='{}'
              st=$(printf '%s' "$row" | jq -r '.status // "none"')
              id=$(printf '%s' "$row" | jq -r '.id // "none"')
              echo "[$i] $name: deployment=$id status=$st"
              case "$st" in
                SUCCESS) echo "- $name: \`$id\` SUCCESS (metadata de Railway)" >> "$GITHUB_STEP_SUMMARY"; return 0 ;;
                FAILED|CRASHED|REMOVED|SKIPPED) echo "::error title=Release FAILED::$name $id $st"; return 1 ;;
              esac
              sleep 15
            done
            echo "::error title=Release FAILED::$name sin SUCCESS para $DEPLOY_SHA en 15 min"; return 1
          }
          verify_svc "$QA_API_SERVICE_ID" "semse-api-qa"
          verify_svc "$QA_WORKER_SERVICE_ID" "semse-worker-qa"
          # G-R06: el Worker no tiene HTTP; su procedencia en runtime sale del
          # log de arranque (label startup) de ESE deployment.
          wbody=$(jq -nc --arg s "$QA_WORKER_SERVICE_ID" --arg e "$QA_ENVIRONMENT_ID" \
            '{query:"query($s:String!,$e:String!){ deployments(first: 10, input:{serviceId:$s, environmentId:$e}) { edges { node { id status meta } } } }", variables:{s:$s,e:$e}}')
          wdep=$(curl -sS "$RAILWAY_API" -H "Project-Access-Token: $RAILWAY_QA_TOKEN" -H "Content-Type: application/json" --data "$wbody" \
            | jq -r --arg c "$DEPLOY_SHA" '[.data.deployments.edges[].node | select(.meta.commitHash == $c and .status == "SUCCESS")] | first | .id // empty')
          [ -n "$wdep" ] || { echo "::error title=Release FAILED::sin deployment SUCCESS del Worker para $DEPLOY_SHA"; exit 1; }
          wok=""
          for i in $(seq 1 20); do
            lbody=$(jq -nc --arg d "$wdep" '{query:"query($d:String!){ deploymentLogs(deploymentId:$d, filter:\"@label:startup\", limit:20) { timestamp attributes { key value } } }", variables:{d:$d}}')
            wv=$(curl -sS "$RAILWAY_API" -H "Project-Access-Token: $RAILWAY_QA_TOKEN" -H "Content-Type: application/json" --data "$lbody" \
              | node project-manager-app/scripts/verify-worker-startup-log.mjs --expect-sha="$DEPLOY_SHA" --deployment-id="$wdep" || true)
            echo "[$i] worker startup: $wv"
            if [ "$(printf '%s' "$wv" | jq -r .verdict 2>/dev/null)" = "VERIFIED" ]; then wok=1; break; fi
            if [ "$(printf '%s' "$wv" | jq -r .verdict 2>/dev/null)" = "MISMATCH" ]; then break; fi
            sleep 15
          done
          [ -n "$wok" ] || { echo "::error title=Release FAILED::el Worker no informa $DEPLOY_SHA en su log de arranque ($wdep)"; exit 1; }
          echo "- semse-worker-qa: \`$wdep\` VERIFIED en runtime (log de arranque)" >> "$GITHUB_STEP_SUMMARY"
          node project-manager-app/scripts/verify-deploy-provenance.mjs \
            --url="$QA_API_URL" --path=/v1/health --expect-sha="$DEPLOY_SHA" \
            --allow-unknown-digest --retries=20 --interval=15 --timeout=5 --markdown >> "$GITHUB_STEP_SUMMARY" \
            || { echo "::error title=Release FAILED::la API de QA no sirve $DEPLOY_SHA en runtime"; exit 1; }
          echo "- Resultado: **VERIFIED** para \`$DEPLOY_SHA\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Superseded summary
        if: steps.guard.outputs.action == 'superseded'
        run: |
          echo "- Resultado: **SUPERSEDED**. QA ya sirve \`${{ steps.guard.outputs.served }}\`, posterior al candidato. No se despliega." >> "$GITHUB_STEP_SUMMARY"
