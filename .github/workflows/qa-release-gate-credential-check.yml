# G-R01 / T1 — Verificación de solo lectura de la credencial de Railway de QA.
#
# Solo corre en la rama de pruebas qa/release-gate y solo usa el secreto
# RAILWAY_QA_TOKEN del entorno qa-release-gate (project token de Railway,
# proyecto "SEMSE AgentRun 1149 Isolated QA", entorno staging).
# No despliega, no modifica nada y nunca imprime el token.
# Re-ejecutado el 27-nov tras revocar un token de prueba (G-R04).
#
# PASS si:
#   1. el token autentica (HTTP 200 sin errors) y pertenece al proyecto y
#      entorno de QA esperados;
#   2. el token NO puede leer el proyecto de producción (SEMSEproject).
name: QA release gate - credential check

on:
  push:
    branches: [qa/release-gate]
    paths:
      - .github/workflows/qa-release-gate-credential-check.yml

permissions:
  contents: read

concurrency:
  group: qa-release-gate-credential-check
  cancel-in-progress: false

jobs:
  credential-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: qa-release-gate
    env:
      RAILWAY_API: https://backboard.railway.com/graphql/v2
      QA_PROJECT_ID: dc1754a3-5563-4274-a81d-5be976911064
      QA_ENVIRONMENT_ID: 159babb8-2eef-4971-87ad-1a7594ca022f
      PROD_PROJECT_ID: 95ad1b14-d1d9-467d-82d8-5354619ba873
    steps:
      - name: Token present
        env:
          RAILWAY_QA_TOKEN: ${{ secrets.RAILWAY_QA_TOKEN }}
        run: |
          if [ -z "${RAILWAY_QA_TOKEN:-}" ]; then
            echo "::error title=T1 FAIL::RAILWAY_QA_TOKEN no está disponible en el entorno qa-release-gate."
            exit 1
          fi
          echo "Token presente (valor no mostrado)."

      - name: Token authenticates and is scoped to QA staging
        env:
          RAILWAY_QA_TOKEN: ${{ secrets.RAILWAY_QA_TOKEN }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o resp.json -w '%{http_code}' "$RAILWAY_API" \
            -H "Project-Access-Token: $RAILWAY_QA_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"query":"query { projectToken { projectId environmentId } }"}')
          echo "HTTP $code"
          if [ "$code" != "200" ] || jq -e '.errors' resp.json >/dev/null; then
            echo "::error title=T1 FAIL::El token no autentica (HTTP $code)."
            jq -c '.errors // empty | map(.message)' resp.json || true
            exit 1
          fi
          pid=$(jq -r '.data.projectToken.projectId' resp.json)
          eid=$(jq -r '.data.projectToken.environmentId' resp.json)
          echo "projectId=$pid"
          echo "environmentId=$eid"
          if [ "$pid" != "$QA_PROJECT_ID" ] || [ "$eid" != "$QA_ENVIRONMENT_ID" ]; then
            echo "::error title=T1 FAIL::El token no pertenece al proyecto/entorno de QA esperados."
            exit 1
          fi
          echo "OK: token del proyecto QA, entorno staging."

      - name: Token cannot read production
        env:
          RAILWAY_QA_TOKEN: ${{ secrets.RAILWAY_QA_TOKEN }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o prod.json -w '%{http_code}' "$RAILWAY_API" \
            -H "Project-Access-Token: $RAILWAY_QA_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"query\":\"query { project(id: \\\"$PROD_PROJECT_ID\\\") { id } }\"}")
          echo "HTTP $code"
          if [ "$code" = "200" ] && jq -e '.data.project.id' prod.json >/dev/null 2>&1; then
            echo "::error title=T1 FAIL::El token de QA puede leer el proyecto de producción."
            exit 1
          fi
          echo "OK: el token de QA no puede leer producción."
          jq -c '.errors // empty | map(.message)' prod.json || true

      - name: Summary
        if: always()
        run: |
          {
            echo "## T1 — credencial de Railway de QA"
            echo "- Rama: \`${GITHUB_REF_NAME}\` @ \`${GITHUB_SHA}\`"
            echo "- Resultado del job: ${{ job.status }}"
            echo "- Solo lectura. No se desplegó ni modificó nada."
          } >> "$GITHUB_STEP_SUMMARY"
